[project]
name = "golddragon"
version = "0.1.5"
description = "Machine Learning Class"
readme = "README.md"
authors = [
    { name = "golddragon", email = "erolingson@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplot>=0.1.9",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
]

[tool.maturin]
module-name = "golddragon._core"
python-packages = ["golddragon"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
